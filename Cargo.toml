[package]
name = "kanban4ai"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
authors = ["sougstron"]
description = "Fast native kanban board CLI + TUI driven by AI coding agents"
license = "MIT"
repository = "https://github.com/sougstron/kanban4ai"
homepage = "https://github.com/sougstron/kanban4ai"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["kanban", "tui", "agents", "opencode", "claude"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
if-addrs = "0.15"
ipnet = { version = "2", features = ["serde"] }
mdns-sd = "0.13.11"
flume = "0.11"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "stream", "rustls-tls"] }
sha2 = "0.10"
subtle = "2"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "fs", "time", "io-util"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2.186"
regex = "1.13.0"
notify = "8.2.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = [
    "crossterm",
    "unstable-rendered-line-info",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
ratatui-textarea = "0.9.2"
unicode-width = "=0.2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.43.2"
predicates = "3.1.4"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["io-util"] }

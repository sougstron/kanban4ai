name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: sh scripts/test-packaging.sh

  build:
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build target
        env:
          # The kanban-server sync node (Debian 13 LXC) runs this asset; keep
          # it on the baseline ISA whatever the runner's CPU is.
          RUSTFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-C target-cpu=x86-64' || '' }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check x86_64 binary runs on the server CPU and glibc
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/kanban4ai"
          if readelf -n "$bin" | grep -q 'x86 ISA needed:.*x86-64-v[234]'; then
            echo "binary requires x86-64-v2 or newer" >&2
            readelf -n "$bin" | grep 'x86 ISA needed' >&2
            exit 1
          fi
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "newest glibc symbol: $newest"
          # kanban-server is Debian 13 (glibc 2.41).
          if [ "$(printf '%s\nGLIBC_2.41\n' "$newest" | sort -V | tail -1)" != GLIBC_2.41 ]; then
            echo "binary needs $newest, newer than the server's glibc 2.41" >&2
            exit 1
          fi
      - name: Create release archive and checksum
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          archive="kanban4ai-${VERSION}-${TARGET}"
          mkdir -p "dist/${archive}"
          cp "target/${TARGET}/release/kanban4ai" "dist/${archive}/"
          cp README.md LICENSE packaging/systemd/kanban4ai.service packaging/systemd/kanban4ai-serve.service packaging/systemd/kanban4ai-sleep@.service packaging/systemd/kanban4ai-shutdown@.service "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          cd dist
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: RELEASE_NOTES.md

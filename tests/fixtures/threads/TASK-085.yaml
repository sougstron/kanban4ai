  body: "Investigated model resolution. Findings: kanban-cli never resolves model\
    \ aliases itself \u2014 operations._build_agent_command (operations.py:923,939-940)\
    \ passes task.ai_model (or backend default 'model') verbatim to the backend CLI\
    \ as '--model <string>'. In this project's .kanban/config.yaml the sonnet/opus/haiku\
    \ aliases exist ONLY under the 'claude' backend (lines 73-77); the 'opencode'\
    \ backend uses full provider/model IDs (openai/gpt-5.5 etc, lines 56-63) and has\
    \ NO bare 'sonnet' alias. So: (1) 'sonnet' is a Claude Code alias, not an opencode\
    \ one; opencode needs an explicit anthropic/claude-sonnet-* ID. (2) 'sonnet' resolves\
    \ to whatever the INSTALLED Claude Code version maps it to \u2014 the latest Sonnet\
    \ that CLI knows, not automatically the newest model on the API. It moves when\
    \ you update Claude Code, not the instant a new model ships. (3) No 'Sonnet 5'\
    \ exists as of now (latest is Sonnet 4.x), so 'sonnet' would not pick a Sonnet\
    \ 5 until such a model exists and the CLI's alias table is updated."
